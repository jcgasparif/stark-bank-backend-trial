name: Deploy to AWS ECS
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: stark-bank-backend-trial
  ECS_CLUSTER: stark-bank-backend-trial
  ECS_SERVICE: stark-bank-backend-trial
  ECS_TASK_DEFINITION: infra/aws/ecs-task-definition.json
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - name: Build and push image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "uri=$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"
      - name: Prepare task definition
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
          EXECUTION_ROLE_ARN: ${{ secrets.ECS_EXECUTION_ROLE_ARN }}
          TASK_ROLE_ARN: ${{ secrets.ECS_TASK_ROLE_ARN }}
          PROJECT_SECRET_ARN: ${{ secrets.STARK_PROJECT_ID_SECRET_ARN }}
          PRIVATE_KEY_SECRET_ARN: ${{ secrets.STARK_PRIVATE_KEY_SECRET_ARN }}
        run: |
          jq --arg image "$IMAGE_URI" --arg execution "$EXECUTION_ROLE_ARN" --arg task "$TASK_ROLE_ARN" --arg project "$PROJECT_SECRET_ARN" --arg private "$PRIVATE_KEY_SECRET_ARN" '.containerDefinitions[0].image=$image | .executionRoleArn=$execution | .taskRoleArn=$task | .containerDefinitions[0].secrets[0].valueFrom=$project | .containerDefinitions[0].secrets[1].valueFrom=$private' "$ECS_TASK_DEFINITION" > /tmp/task-definition.json
      - uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: /tmp/task-definition.json
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

