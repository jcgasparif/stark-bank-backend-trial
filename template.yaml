AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Stark Bank trial serverless stack with SQS retry and DLQ
Parameters:
  StarkProjectId: {Type: String, NoEcho: true}
  StarkPrivateKeyBase64: {Type: String, NoEcho: true}
Resources:
  InvoiceDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: stark-bank-invoice-dlq
      MessageRetentionPeriod: 1209600
  InvoiceQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: stark-bank-invoice-queue
      VisibilityTimeout: 180
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt InvoiceDlq.Arn
        maxReceiveCount: 5
  TrialTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: stark-bank-backend-trial
      BillingMode: PROVISIONED
      ProvisionedThroughput: {ReadCapacityUnits: 1, WriteCapacityUnits: 1}
      AttributeDefinitions: [{AttributeName: pk, AttributeType: S}]
      KeySchema: [{AttributeName: pk, KeyType: HASH}]
  WebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: stark-bank-webhook
      Runtime: python3.12
      Handler: starkbank_trial.lambda_handler.lambda_http_handler
      CodeUri: src
      MemorySize: 256
      Timeout: 30
      Environment:
        Variables:
          STARK_ENVIRONMENT: sandbox
          STARK_PROJECT_ID: !Ref StarkProjectId
          STARK_PRIVATE_KEY_B64: !Ref StarkPrivateKeyBase64
          DYNAMODB_TABLE: !Ref TrialTable
          INVOICE_QUEUE_URL: !Ref InvoiceQueue
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref TrialTable}
        - SQSSendMessagePolicy: {QueueName: !GetAtt InvoiceQueue.QueueName}
      FunctionUrlConfig:
        AuthType: NONE
        Cors: {AllowOrigins: ["*"], AllowMethods: ["POST"]}
  WorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: stark-bank-worker
      Runtime: python3.12
      Handler: starkbank_trial.lambda_handler.lambda_worker_handler
      CodeUri: src
      MemorySize: 256
      Timeout: 30
      Environment:
        Variables:
          STARK_ENVIRONMENT: sandbox
          STARK_PROJECT_ID: !Ref StarkProjectId
          STARK_PRIVATE_KEY_B64: !Ref StarkPrivateKeyBase64
          DYNAMODB_TABLE: !Ref TrialTable
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref TrialTable}
      Events:
        InvoiceQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt InvoiceQueue.Arn
            BatchSize: 1
            FunctionResponseTypes: [ReportBatchItemFailures]
Outputs:
  FunctionUrl:
    Value: !GetAtt WebhookFunctionUrl.FunctionUrl
  QueueUrl:
    Value: !Ref InvoiceQueue
  DeadLetterQueueUrl:
    Value: !Ref InvoiceDlq
