[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "starkbank-backend-trial"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["Flask>=3,<4", "python-dotenv>=1,<2", "starkbank>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
